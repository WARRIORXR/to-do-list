<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Smart To-Do List</title>
  <meta name="description" content="A premium, feature-rich to-do list application with priorities, due dates, filtering, and local storage persistence." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Undo Toast -->
  <div id="undo-toast" class="undo-toast" aria-live="polite">
    <span id="undo-message">Task deleted.</span>
    <button id="undo-btn" class="undo-btn">Undo</button>
    <div id="undo-timer-bar" class="undo-timer-bar"></div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <h3 id="modal-title">Delete Task?</h3>
      <p id="modal-message">This action cannot be undone.</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
        <button id="modal-confirm" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Import File Input (hidden) -->
  <input type="file" id="import-file" accept=".json" hidden />

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <h1>TaskFlow</h1>
        </div>
        <div class="header-actions">
          <button id="export-btn" class="icon-btn" title="Export Tasks" aria-label="Export tasks as JSON">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button id="import-btn" class="icon-btn" title="Import Tasks" aria-label="Import tasks from JSON">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>
          <button id="theme-toggle" class="icon-btn" title="Toggle Dark Mode" aria-label="Toggle dark mode">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off" />
          <button id="search-clear" class="search-clear" title="Clear search" aria-label="Clear search" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Add / Edit Task Form -->
      <form id="task-form" class="task-form" novalidate>
        <h2 id="form-title" class="form-title">New Task</h2>
        <div class="form-grid">
          <div class="form-group form-group-full">
            <label for="task-title">Title <span class="required">*</span></label>
            <input type="text" id="task-title" placeholder="What needs to be done?" required />
            <span id="title-error" class="field-error" hidden>Please enter a task title.</span>
          </div>
          <div class="form-group form-group-full">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" placeholder="Add details (optional)" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input type="date" id="task-due" />
          </div>
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <div class="select-wrapper">
              <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="form-cancel" class="btn btn-ghost" hidden>Cancel</button>
          <button type="submit" id="form-submit" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="form-submit-text">Add Task</span>
          </button>
        </div>
      </form>

      <!-- Filter & Sort Controls -->
      <div class="controls-bar">
        <div class="filter-group" role="tablist" aria-label="Task status filter">
          <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
            All <span class="badge" id="count-all">0</span>
          </button>
          <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">
            Active <span class="badge" id="count-active">0</span>
          </button>
          <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">
            Completed <span class="badge" id="count-completed">0</span>
          </button>
        </div>

        <div class="extra-filters">
          <div class="select-wrapper small">
            <select id="filter-priority" aria-label="Filter by priority">
              <option value="all">All Priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="select-wrapper small">
            <select id="filter-date" aria-label="Filter by due date">
              <option value="all">All Dates</option>
              <option value="today">Due Today</option>
              <option value="week">This Week</option>
              <option value="overdue">Overdue</option>
            </select>
          </div>
          <div class="select-wrapper small">
            <select id="sort-by" aria-label="Sort tasks">
              <option value="created-desc">Newest First</option>
              <option value="created-asc">Oldest First</option>
              <option value="priority">Priority</option>
              <option value="due-asc">Due Date ↑</option>
              <option value="due-desc">Due Date ↓</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Task List -->
      <div id="task-list" class="task-list" role="list">
        <!-- Tasks rendered by JS -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
        <h3 id="empty-title">No tasks yet</h3>
        <p id="empty-subtitle">Add your first task above to get started!</p>
      </div>

      <!-- Footer Stats -->
      <footer class="app-footer">
        <div class="stats">
          <span id="stats-active"><strong>0</strong> active</span>
          <span class="stats-divider">·</span>
          <span id="stats-completed"><strong>0</strong> completed</span>
        </div>
        <div class="footer-actions">
          <button id="clear-completed-btn" class="btn btn-ghost btn-sm" hidden>Delete All Completed</button>
          <button id="clear-all-btn" class="btn btn-ghost btn-sm btn-danger-text">Clear All Data</button>
        </div>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
